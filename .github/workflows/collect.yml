# 記録を集める（元は _work/攻略アプリ/collect/。deploy_site.py が site/.github/ に写す）。集めた生の記録は data 枝（暗号化）、毎晩の1日分の記録は main の recent.js
#  live: ThemeParks.wiki の待ち・休止を1分ごと（暗号化）と気象庁の天気予報。1回最長340分で、終わると次の回を自分で起動する（同時に1本）。7時前は7時まで待つ。
#        定期実行は1日数回しか動かず、11/1・11/2 は開園直後と昼すぎに数時間ずつ抜けたので、30分ごとの予約はつながりが切れたときの予備
#  night: 日本時間 23:40ごろ、その日の1分ごとの記録からアプリの1日分の記録を作って recent.js に足し（night.py）、それを入れたアプリで翌日から14日分の予測を発行して固定（issue_forecast.cjs）
name: collect
on:
  schedule:
    - cron: "7,37 22,23,0-13 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch:
    inputs:
      minutes: { description: "待ちを読む分数（0 なら読まない。22:45 まで）", default: "340" }
      night: { description: "毎晩の記録づくりと予測の発行もする", type: boolean, default: false }
      day: { description: "毎晩の記録を作る日（空ならきょう）", default: "" }
permissions:
  contents: write
  actions: write  # 次の回を起動する
jobs:
  live:
    if: github.event.schedule == '7,37 22,23,0-13 * * *' || (github.event_name == 'workflow_dispatch' && inputs.minutes != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency: { group: live, cancel-in-progress: false }  # 同時に動くのは1本（待っている次の1本が、今の回が終わったら動く）
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - run: node .github/collect/live.mjs
        env: { TPW_KEY: "${{ secrets.TPW_KEY }}", MINUTES: "${{ inputs.minutes || '340' }}" }
      - run: bash .github/collect/save.sh "待ち・天気予報"
        env: { GH_TOKEN: "${{ github.token }}" }
      # 次の回を起動（失敗した回は10分おいてから。すぐ失敗が続いても1時間に数回まで）
      - if: always() && !cancelled()
        run: '[ "${{ job.status }}" = success ] || sleep 600; gh workflow run collect.yml -R "${{ github.repository }}" --ref main'
        env: { GH_TOKEN: "${{ github.token }}" }
  night:
    if: github.event.schedule == '40 14 * * *' || inputs.night
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" g
      - run: python3 .github/collect/night.py g . ${{ inputs.day }}
        env: { TPW_KEY: "${{ secrets.TPW_KEY }}" }
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recent.js; git diff --cached --quiet || git commit -qm "毎晩の記録"
          for i in 1 2 3 4 5; do git push -q origin HEAD:main && break; sleep $((i * 7)); git pull -q --rebase origin main; done
      # 発行の直前の気象庁の大阪府の予報を入れて発行する（2026-11-02 予測検証/audit1102: 前日に出ていた予報から天気の区分を入れると前日夜 −0.21±0.10分、4期間とも改善）。取れなければ天気なしで発行
      - run: |
          mkdir -p out/jma/270000
          if curl -sf -A "usj-navi-collector" https://www.jma.go.jp/bosai/forecast/data/forecast/270000.json -o jma.json; then
            cp jma.json "out/jma/270000/$(node -p 'require("./jma.json")[0].reportDatetime.replace(/:/g,"")').json"; W="--weather jma.json"; else W=""; fi
          node .github/issue/issue_forecast.cjs --html index.html --engine .github/issue/engine.js --recent recent.js --out out/issued --inputs out/inputs $W
      - run: bash .github/collect/save.sh "予測の発行"
        env: { GH_TOKEN: "${{ github.token }}" }
